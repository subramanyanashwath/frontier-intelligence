name: Monthly sweep

on:
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Monthly sweep
        run: pnpm sweep:monthly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_QUERY: artificial intelligence
          INGEST_MAX_PAGES: "3"
          INGEST_DELAY_MS: "1200"
